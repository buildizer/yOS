<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS Settings: Clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A84FF}a:hover{color:#4BA3FF}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000;">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; background: #000000; z-index: 2;">
<span>18:42</span>
<span style="display: flex; gap: 10px; align-items: center;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
</span>
</div>

<div style="position: absolute; top: 32px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 0 16px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
<a href="Settings.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 2px; font-size: 17px; text-decoration: none; align-self: flex-start;">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Settings</a>
<h1 style="margin: 0 0 4px; font-size: 30px; font-weight: 700;">Clock</h1>

<div style="background: #1C1C1E; border-radius: 12px; min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<span style="font-size: 17px;">24-Hour Time</span>
<button type="button" role="switch" aria-checked="{{ h24 }}" aria-label="24-Hour Time" onClick="{{ toggle24 }}" style="width: 51px; height: 31px; border: 0; border-radius: 16px; background: {{ h24Bg }}; position: relative; cursor: pointer; padding: 0;">
<span style="position: absolute; top: 2px; left: {{ h24Knob }}; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF;"></span>
</button>
</div>
<div style="font-size: 13px; color: #98989F; padding: 0 16px;">Also changes the status bar and the Home Screen clock.</div>

<div style="font-size: 15px; color: #98989F; padding: 4px 16px 0;">World Clocks</div>
<div style="background: #1C1C1E; border-radius: 12px; overflow: hidden;">
<div style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<span style="font-size: 17px;">Show in Clock</span>
<button type="button" role="switch" aria-checked="{{ wc }}" aria-label="Show world clocks in Clock" onClick="{{ toggleWc }}" style="width: 51px; height: 31px; border: 0; border-radius: 16px; background: {{ wcBg }}; position: relative; cursor: pointer; padding: 0;">
<span style="position: absolute; top: 2px; left: {{ wcKnob }}; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF;"></span>
</button>
</div>
<sc-if value="{{ wcOn }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ cities }}" as="c" hint-placeholder-count="2">
<div style="min-height: 50px; display: flex; align-items: center; gap: 12px; margin-left: 16px; padding-right: 16px; border-top: 1px solid #38383A;">
<button type="button" onClick="{{ c.remove }}" aria-label="Remove {{ c.name }}" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<span style="width: 22px; height: 22px; border-radius: 50%; background: #FF453A; display: flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 2px; background: #FFFFFF; border-radius: 1px;"></span></span>
</button>
<span style="flex: 1; font-size: 17px;">{{ c.name }}</span>
<span style="font-size: 15px; color: #98989F;">{{ c.offset }}</span>
</div>
</sc-for>
<a href="#" style="min-height: 50px; display: flex; align-items: center; margin-left: 16px; border-top: 1px solid #38383A; font-size: 17px; text-decoration: none;">Add City…</a>
</sc-if>
</div>
<div style="font-size: 13px; color: #98989F; padding: 0 16px;">{{ wcNote }}</div>
</div>
<div style="position: absolute; bottom: 8px; left: 170px; width: 140px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.6);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { h24: true, wc: false, cities: [{ name: 'London', offset: '−2 hrs' }, { name: 'Dubai', offset: '+1 hr' }] };
  }
  renderVals() {
    var s = this.state;
    var on = (v) => v ? 'true' : 'false';
    return {
      h24: on(s.h24), h24Bg: s.h24 ? '#30D158' : '#39393D', h24Knob: s.h24 ? '22px' : '2px',
      toggle24: () => this.setState({ h24: !s.h24 }),
      wc: on(s.wc), wcOn: s.wc, wcBg: s.wc ? '#30D158' : '#39393D', wcKnob: s.wc ? '22px' : '2px',
      toggleWc: () => this.setState({ wc: !s.wc }),
      wcNote: s.wc ? 'These cities appear at the bottom of the Clock app, up to three.' : 'Off: the Clock app shows only the local time.',
      cities: s.cities.map((c, i) => ({ name: c.name, offset: c.offset,
        remove: () => this.setState({ cities: s.cities.filter((_, j) => j !== i) }) }))
    };
  }
}
</script>
</body>
</html>
