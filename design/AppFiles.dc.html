<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS Files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A84FF}a:hover{color:#4BA3FF}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000;">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; background: #000000; z-index: 2;">
<span>18:42</span>
<span style="display: flex; gap: 10px; align-items: center;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
</span>
</div>

<div style="position: absolute; top: 32px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 0 16px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; padding-top: 14px; font-size: 30px; font-weight: 700;">Browse</h1>

<label style="height: 40px; border-radius: 10px; background: #1C1C1E; display: flex; align-items: center; gap: 8px; padding: 0 12px;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98989F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search files</span>
<input type="search" placeholder="Search" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #FFFFFF; font: 17px Inter, system-ui, sans-serif; outline: none;">
</label>

<div style="font-size: 20px; font-weight: 700; padding-top: 6px;">Locations</div>
<div style="background: #1C1C1E; border-radius: 12px; overflow: hidden;">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #FFFFFF;">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01"/><path d="M10 16h.01"/></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; justify-content: space-between; font-size: 17px;"><span>SD Card</span><span style="color: #98989F; font-size: 15px;">128 KB of 50 GB</span></span>
<span style="height: 6px; border-radius: 3px; background: #38383A; position: relative;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3%; border-radius: 3px; background: #0A84FF;"></span></span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-left: 0; border-top: 1px solid #38383A; text-decoration: none; color: #FFFFFF;">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#98989F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M9 2v2M15 20v2M9 20v2M20 15h2M20 9h2M2 15h2M2 9h2"/></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; justify-content: space-between; font-size: 17px;"><span>On This Device</span><span style="color: #98989F; font-size: 15px;">16 KB of 3.4 MB</span></span>
<span style="height: 6px; border-radius: 3px; background: #38383A; position: relative;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 2%; border-radius: 3px; background: #98989F;"></span></span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
</a>
</div>

<div style="font-size: 20px; font-weight: 700; padding-top: 6px;">Folders</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{ folders }}" as="f" hint-placeholder-count="3">
<a href="#" style="background: #1C1C1E; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #FFFFFF; min-height: 96px; box-sizing: border-box;">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#0A84FF" stroke="#0A84FF" stroke-width="1.5" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
<span style="font-size: 15px; font-weight: 600;">{{ f.name }}</span>
<span style="font-size: 13px; color: #98989F;">{{ f.info }}</span>
</a>
</sc-for>
</div>

<div style="font-size: 20px; font-weight: 700; padding-top: 6px;">Storage</div>
<div style="background: #1C1C1E; border-radius: 12px; overflow: hidden;">
<button type="button" style="width: 100%; min-height: 50px; border: 0; background: transparent; color: #FF453A; font: 17px Inter, system-ui, sans-serif; text-align: left; padding: 0 16px; cursor: pointer;">Clear Netwatch Logs</button>
<button type="button" style="width: 100%; min-height: 50px; border: 0; border-top: 1px solid #38383A; background: transparent; color: #FF453A; font: 17px Inter, system-ui, sans-serif; text-align: left; padding: 0 16px; cursor: pointer;">Format SD Card…</button>
</div>
<div style="font-size: 13px; color: #98989F; padding: 0 16px;">Formatting erases everything on the card. You'll be asked to confirm.</div>
</div>
<a href="Main.dc.html" aria-label="Go Home" style="position: absolute; bottom: 0; left: 150px; width: 180px; height: 24px; display: flex; align-items: center; justify-content: center;"><span style="width: 140px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.6);"></span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      folders: [
        { name: 'Netwatch', info: '3 files · 2.4 KB' },
        { name: 'Wallpapers', info: '6 files · 1.4 MB' },
        { name: 'Apps', info: 'Empty' }
      ]
    };
  }
}
</script>
</body>
</html>
