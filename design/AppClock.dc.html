<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS Clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF9F0A}a:hover{color:#FFB840}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000;">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600;">
<span>{{ statusTime }}</span>
<span style="display: flex; gap: 10px; align-items: center;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
</span>
</div>

<div style="position: absolute; top: 56px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="display: flex; align-items: flex-start; gap: 8px; line-height: 1;">
<span style="font-size: 120px; font-weight: 300; letter-spacing: -5px;">{{ time }}</span>
<span style="display: flex; flex-direction: column; gap: 10px; padding-top: 14px;">
<span style="font-size: 22px; font-weight: 600; color: #FF9F0A;">{{ ampm }}</span>
<span style="font-size: 22px; font-weight: 500; color: #98989F; font-variant-numeric: tabular-nums;">42</span>
</span>
</div>
<div style="font-size: 22px; font-weight: 600;">Thursday, 29 October</div>
<div style="font-size: 17px; color: #98989F; display: flex; align-items: center; gap: 8px;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/><path d="M12 2v2"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/></svg>
Cairo · 26°
</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 30px; background: #1C1C1E; border-radius: 14px; overflow: hidden;">
<sc-for list="{{ zones }}" as="z" hint-placeholder-count="2">
<div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; margin-left: 16px; padding-right: 16px; border-top: {{ z.sep }};">
<span style="display: flex; flex-direction: column;"><span style="font-size: 13px; color: #98989F;">{{ z.offset }}</span><span style="font-size: 20px; font-weight: 500;">{{ z.city }}</span></span>
<span style="font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums;">{{ z.time }}</span>
</div>
</sc-for>
</div>

<button type="button" onClick="{{ toggleFormat }}" style="position: absolute; top: 40px; right: 16px; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: #1C1C1E; color: #FF9F0A; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer;">{{ formatLabel }}</button>
<a href="Main.dc.html" aria-label="Go Home" style="position: absolute; bottom: 0; left: 150px; width: 180px; height: 24px; display: flex; align-items: center; justify-content: center;"><span style="width: 140px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.6);"></span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { h12: false };
  }
  renderVals() {
    var h12 = this.state.h12;
    var line = '1px solid #38383A';
    return {
      time: h12 ? '6:42' : '18:42',
      ampm: h12 ? 'PM' : '',
      statusTime: h12 ? '6:42 PM' : '18:42',
      formatLabel: h12 ? '24-Hour' : '12-Hour',
      toggleFormat: () => this.setState({ h12: !this.state.h12 }),
      zones: [
        { city: 'London', offset: 'Today, −2 hrs', time: h12 ? '4:42 PM' : '16:42', sep: '0' },
        { city: 'Dubai', offset: 'Today, +1 hr', time: h12 ? '7:42 PM' : '19:42', sep: line }
      ]
    };
  }
}
</script>
</body>
</html>
