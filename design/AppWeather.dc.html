<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS Weather</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #23508E;">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; background: #23508E; z-index: 2;">
<span>18:42</span>
<span style="display: flex; gap: 10px; align-items: center;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
</span>
</div>

<div style="position: absolute; top: 32px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 8px 16px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
<div style="font-size: 28px; font-weight: 600;">Cairo</div>
<div style="font-size: 84px; font-weight: 300; line-height: 1; letter-spacing: -2px;">26°</div>
<div style="font-size: 20px; font-weight: 500;">Partly Cloudy</div>
<div style="font-size: 17px; font-weight: 500;">H:28°  L:18°</div>
</div>

<div style="background: rgba(255, 255, 255, 0.14); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 13px; color: rgba(255, 255, 255, 0.78); border-bottom: 1px solid rgba(255, 255, 255, 0.18); padding-bottom: 8px;">Clear skies tonight. Wind up to 15 km/h.</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center; gap: 4px;">
<sc-for list="{{ hours }}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;">
<span>{{ h.t }}</span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ h.icon }}"/></svg>
<span>{{ h.temp }}</span>
</div>
</sc-for>
</div>
</div>

<div style="background: rgba(255, 255, 255, 0.14); border-radius: 16px; padding: 10px 14px;">
<div style="font-size: 13px; color: rgba(255, 255, 255, 0.78); padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.18);">5-DAY FORECAST</div>
<sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
<div style="min-height: 44px; display: grid; grid-template-columns: 80px 32px 40px minmax(0, 1fr) 40px; align-items: center; gap: 6px; font-size: 17px; font-weight: 500; border-top: {{ d.sep }};">
<span>{{ d.day }}</span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ d.icon }}"/></svg>
<span style="color: rgba(255, 255, 255, 0.78); text-align: right;">{{ d.lo }}</span>
<span style="height: 5px; border-radius: 3px; background: rgba(0, 0, 0, 0.22); position: relative;"><span style="position: absolute; top: 0; bottom: 0; left: {{ d.barL }}; right: {{ d.barR }}; border-radius: 3px; background: #FFC145;"></span></span>
<span>{{ d.hi }}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
<div style="background: rgba(255, 255, 255, 0.14); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 92px; box-sizing: border-box;">
<span style="font-size: 13px; color: rgba(255, 255, 255, 0.78);">{{ t.label }}</span>
<span style="font-size: 28px; font-weight: 500;">{{ t.value }}</span>
<span style="font-size: 13px; color: rgba(255, 255, 255, 0.78);">{{ t.note }}</span>
</div>
</sc-for>
</div>
</div>
<a href="Main.dc.html" aria-label="Go Home" style="position: absolute; bottom: 0; left: 150px; width: 180px; height: 24px; display: flex; align-items: center; justify-content: center;"><span style="width: 140px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.7);"></span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var sun = 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2';
    var partly = 'M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6ZM12 2v2M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13';
    var moon = 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z';
    var cloud = 'M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z';
    var line = '1px solid rgba(255, 255, 255, 0.18)';
    return {
      hours: [
        { t: 'Now', icon: partly, temp: '26°' }, { t: '19', icon: partly, temp: '25°' }, { t: '20', icon: moon, temp: '23°' },
        { t: '21', icon: moon, temp: '22°' }, { t: '22', icon: moon, temp: '21°' }, { t: '23', icon: moon, temp: '20°' }
      ],
      days: [
        { day: 'Today', icon: partly, lo: '18°', hi: '28°', barL: '20%', barR: '15%', sep: '0' },
        { day: 'Fri', icon: sun, lo: '19°', hi: '29°', barL: '28%', barR: '8%', sep: line },
        { day: 'Sat', icon: sun, lo: '19°', hi: '30°', barL: '28%', barR: '0%', sep: line },
        { day: 'Sun', icon: cloud, lo: '17°', hi: '26°', barL: '12%', barR: '30%', sep: line },
        { day: 'Mon', icon: partly, lo: '16°', hi: '27°', barL: '5%', barR: '22%', sep: line }
      ],
      tiles: [
        { label: 'FEELS LIKE', value: '25°', note: 'Similar to the actual temperature.' },
        { label: 'HUMIDITY', value: '30%', note: 'Dry air.' },
        { label: 'WIND', value: '15 km/h', note: 'From the north.' },
        { label: 'SUNSET', value: '17:06', note: 'Sunrise 06:12' }
      ]
    };
  }
}
</script>
</body>
</html>
