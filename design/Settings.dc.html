<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000;">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; background: #000000; z-index: 2;">
<span>18:42</span>
<span style="display: flex; gap: 10px; align-items: center;">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
</span>
</div>

<div style="position: absolute; top: 32px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 0 16px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px;">
<h1 style="margin: 0; font-size: 30px; font-weight: 700;">Settings</h1>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; color: #0A84FF; font-size: 17px; font-weight: 600; text-decoration: none;">Done</a>
</div>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">
<sc-if value="{{ g.header }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 15px; color: #98989F; padding: 6px 16px 0;">{{ g.header }}</div>
</sc-if>
<div style="background: #1C1C1E; border-radius: 12px; overflow: hidden;">
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
<a href="{{ r.href }}" style="min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-decoration: none; color: #FFFFFF; position: relative;">
<span style="width: 30px; height: 30px; border-radius: 7px; background: {{ r.tint }}; display: flex; align-items: center; justify-content: center; flex: none;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.path }}"/></svg>
</span>
<span style="flex: 1; font-size: 17px; border-top: {{ r.sep }}; align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-right: -14px; padding-right: 14px;">
<span>{{ r.title }}</span>
<span style="display: flex; align-items: center; gap: 6px; color: #98989F;">{{ r.value }}
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
</span>
</span>
</a>
</sc-for>
</div>
</div>
</sc-for>

<button type="button" style="margin-top: 10px; min-height: 50px; border: 0; border-radius: 12px; background: #1C1C1E; color: #FF453A; font: 17px Inter, system-ui, sans-serif; cursor: pointer;">Restart</button>
</div>
<div style="position: absolute; bottom: 8px; left: 170px; width: 140px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.6);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var none = '0';
    var line = '1px solid #38383A';
    return {
      groups: [
        { header: '', rows: [
          { title: 'Wi-Fi', value: 'Flyaix_IoT', href: 'SettingsWifi.dc.html', tint: '#0A84FF', sep: none, path: 'M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0' },
          { title: 'Bluetooth', value: 'Off', href: '#', tint: '#0A84FF', sep: line, path: 'm7 7 10 10-5 5V2l5 5L7 17' }
        ] },
        { header: '', rows: [
          { title: 'Display & Brightness', value: '', href: 'SettingsDisplay.dc.html', tint: '#0A84FF', sep: none, path: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2' },
          { title: 'About', value: '', href: 'SettingsAbout.dc.html', tint: '#636366', sep: line, path: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM12 16v-4M12 8h.01' }
        ] },
        { header: 'Apps', rows: [
          { title: 'Netwatch', value: '', href: '#', tint: '#248A3D', sep: none, path: 'M22 12h-4l-3 9L9 3l-3 9H2' },
          { title: 'Clock', value: '', href: '#', tint: '#3A3A3C', sep: line, path: 'M12 6v6l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0' },
          { title: 'Weather', value: '', href: '#', tint: '#1E6FD9', sep: line, path: 'M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6ZM12 2v2M20 12h2M19.07 4.93l-1.41 1.41' },
          { title: 'Files', value: '', href: '#', tint: '#0060DF', sep: line, path: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
