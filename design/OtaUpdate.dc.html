<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yOS software update</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A84FF}a:hover{color:#4BA3FF}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000; display: flex; flex-direction: column; align-items: center;">
<div style="margin-top: 44px; position: relative; width: 168px; height: 168px;">
<svg role="img" aria-label="Update progress {{ pctText }}" width="168" height="168" viewBox="0 0 168 168">
<circle cx="84" cy="84" r="74" fill="none" stroke="#2C2C2E" stroke-width="10"/>
<circle cx="84" cy="84" r="74" fill="none" stroke="#0A84FF" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{ dash }}" transform="rotate(-90 84 84)"/>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
<span style="font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ pctText }}</span>
<span style="font-size: 13px; color: #98989F;">{{ remaining }}</span>
</div>
</div>

<h1 style="margin: 22px 0 4px; font-size: 22px; font-weight: 600;">Updating yOS</h1>
<div style="font-size: 15px; color: #98989F;">1.1 → 1.2 · over Wi-Fi</div>

<ol style="margin: 20px 0 0; padding: 0; list-style: none; width: 300px; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: {{ st.color }};">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ st.icon }}"/></svg>
<span>{{ st.label }}</span>
</li>
</sc-for>
</ol>

<div style="position: absolute; left: 20px; right: 20px; bottom: 20px; min-height: 44px; border-radius: 12px; background: #2A2205; color: #FFD60A; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
Keep the panel powered on
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":100,"step":1,"default":64,"unit":"%"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var p = Math.max(0, Math.min(100, this.props.progress ?? 64));
    var circ = 2 * Math.PI * 74;
    var check = 'M20 6 9 17l-5-5';
    var dot = 'M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0';
    var ring = 'M12 3a9 9 0 1 0 9 9';
    var phase = p < 90 ? 0 : p < 100 ? 1 : 2;
    var steps = ['Receiving update', 'Verifying', 'Restarting'].map(function (label, i) {
      var done = i < phase || p >= 100;
      var active = i === phase && p < 100;
      return { label: label, icon: done ? check : active ? ring : dot, color: done ? '#30D158' : active ? '#FFFFFF' : '#636366' };
    });
    return {
      pctText: p + '%',
      dash: (circ * p / 100).toFixed(1) + ' ' + circ.toFixed(1),
      remaining: p >= 100 ? 'Done' : 'About ' + Math.max(1, Math.round((100 - p) / 6)) + ' s left',
      steps: steps
    };
  }
}
</script>
</body>
</html>
