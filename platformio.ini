; yOS for the Guition ESP32-4848S040 (ESP32-S3 N16R8, 4" 480x480 ST7701 RGB panel, GT911 touch, microSD)
[env:yos]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DYOS_DEV_TOOLS
  ; Bluetooth: NimBLE host buffers in PSRAM, one connection; internal RAM is kept for Wi-Fi
  -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=2
  -Iinclude
  -Isrc
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD/src

lib_deps =
  moononournation/GFX Library for Arduino@1.4.7
  marian-craciunescu/ESP32Ping@^1.7
  bblanchon/ArduinoJson@^7.2.0
  lvgl/lvgl@8.3.11
  h2zero/NimBLE-Arduino@^1.4.2

monitor_speed = 115200
upload_speed = 115200

; Same firmware, uploaded over Wi-Fi. Use tools/flash.sh (it asks for the Update Password and keeps it in the Keychain).
[env:yos-ota]
extends = env:yos
upload_protocol = espota
upload_port = ${sysenv.YOS_OTA_HOST}
upload_flags = --auth=${sysenv.YOS_OTA_PASS}
