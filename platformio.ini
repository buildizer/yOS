; yOS for the Guition ESP32-4848S040 (ESP32-S3 N16R8, 4" 480x480 ST7701 RGB panel, GT911 touch, microSD)
[env:yos]
; pioarduino: Arduino core 3.3 on ESP-IDF 5.5 (LCD bounce buffers, newer memory options)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.embed_files = data/x509_crt_bundle.bin  ; TLS roots for HTTPS (tools/gen_cert_bundle.py)
; names the image "yOS <version>" and writes firmware.bin.gz, the file updates send (tools/firmware_post.py)
extra_scripts = post:tools/firmware_post.py

build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DYOS_DEV_TOOLS
  ; Bluetooth: NimBLE host buffers in PSRAM, one connection; internal RAM is kept for Wi-Fi
  -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; bonds: the remembered device + up to 3 phones
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4
  -Iinclude
  -Isrc
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD/src

lib_deps =
  moononournation/GFX Library for Arduino@1.6.9
  marian-craciunescu/ESP32Ping@^1.7
  bblanchon/ArduinoJson@^7.2.0
  lvgl/lvgl@8.3.11
  h2zero/NimBLE-Arduino@2.5.2

monitor_speed = 115200
upload_speed = 921600  ; recovery flashing through the ROM loader (esptool); 115200 took over 2 minutes

; Same firmware, uploaded over Wi-Fi. Use tools/flash.sh (it asks for the Update Password and keeps it in the Keychain).
[env:yos-ota]
extends = env:yos
upload_protocol = espota
upload_port = ${sysenv.YOS_OTA_HOST}
upload_flags = --auth=${sysenv.YOS_OTA_PASS}
