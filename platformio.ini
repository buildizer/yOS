; yOS for the Guition ESP32-4848S040 (ESP32-S3 N16R8, 4" 480x480 ST7701 RGB panel, GT911 touch, microSD)
[env:yos]
; pioarduino: Arduino core 3.3 on ESP-IDF 5.5 (LCD bounce buffers, newer memory options)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv  ; Arduino's 16 MB layout, in the repo for the framework rebuild; same table as the core 2.x builds
board_build.embed_files = data/x509_crt_bundle.bin  ; TLS roots for HTTPS (tools/gen_cert_bundle.py)
; names the image "yOS <version>" and writes firmware.bin.gz, the file updates send (tools/firmware_post.py)
; include/ and src/ (plus the SD library's internals) on the include path of yOS sources only (tools/src_paths.py)
extra_scripts =
  post:tools/src_paths.py
  post:tools/firmware_post.py

build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
  ; LVGL finds include/lv_conf.h by path: include/ itself is only for yOS sources (below)
  -DLV_CONF_PATH=${PROJECT_DIR}/include/lv_conf.h
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DYOS_DEV_TOOLS

; ESP-IDF options the prebuilt Arduino libraries don't have. Setting any of these makes pioarduino rebuild
; the framework libraries from ESP-IDF once (slow: tens of minutes on a small machine, cached afterwards).
custom_sdkconfig =
  ; code and constants run from PSRAM: flash writes (updates, settings) no longer stop the cache, so the
  ; panel's refill interrupt keeps the picture steady while flashing
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  ; internal RAM: Wi-Fi and lwIP buffers try PSRAM first; 48 KB stay reserved for DMA and internal-only use
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=49152
  ; the panel's refill interrupt is on core 0 (every ~0.46 ms): the Bluetooth controller goes to core 1,
  ; and the interrupt watchdog gets 1 s instead of 300 ms
  CONFIG_BT_CTRL_PINNED_TO_CORE_1=y
  '# CONFIG_BT_CTRL_PINNED_TO_CORE_0 is not set'
  CONFIG_ESP_INT_WDT_TIMEOUT_MS=1000
  ; Bluetooth: NimBLE host buffers in PSRAM, one connection; bonds: the remembered device + up to 3 phones
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  CONFIG_BT_NIMBLE_MAX_BONDS=4
  ; updates: a new image must confirm itself or the bootloader rolls back (services/firmware_update.cpp)
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
; not used by yOS; left out of the framework rebuild
custom_component_remove =
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp-sr
  espressif/esp32-camera
  espressif/esp-modbus
  chmorgan/esp-libhelix-mp3

lib_deps =
  moononournation/GFX Library for Arduino@1.6.9
  marian-craciunescu/ESP32Ping@^1.7
  bblanchon/ArduinoJson@^7.2.0
  lvgl/lvgl@8.3.11
  h2zero/NimBLE-Arduino@2.5.2

monitor_speed = 115200
upload_speed = 921600  ; recovery flashing through the ROM loader (esptool); 115200 took over 2 minutes

; Same firmware, uploaded over Wi-Fi. Use tools/flash.sh (it asks for the Update Password and keeps it in the Keychain).
[env:yos-ota]
extends = env:yos
upload_protocol = espota
upload_port = ${sysenv.YOS_OTA_HOST}
upload_flags = --auth=${sysenv.YOS_OTA_PASS}
